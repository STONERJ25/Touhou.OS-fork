# /etc/network.conf -- how each network card gets its address (network.conf(5))
# One line per card; a card that is not listed uses DHCP. Examples:
#   eth0  dhcp
#   eth0  static 192.168.1.20/24  gateway 192.168.1.1  dns 1.1.1.1 9.9.9.9
#   eth0  static 10.0.0.5/8  mac 52:54:00:12:34:56   (only on the card with this address)
